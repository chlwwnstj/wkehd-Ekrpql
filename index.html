<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>롯데 선수 추천 맛집 탐색</title>

  <style>
    /* 기본 여백 제거 및 화면 전체 사용 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Malgun Gothic", sans-serif;
      height: 100vh;
    }

    /* 화면 2분할: 왼쪽(탭 + 검색) + 오른쪽(지도) */
    .container {
      display: flex;
      height: 100%;
    }

    .sidebar {
      width: 320px;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #ddd;
    }

    .map-area {
      flex: 1;
      position: relative;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    /* 로드뷰는 지도 위에 겹쳐서 보여주고, 평소에는 숨김 */
    #roadview {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      display: none;
    }

    #closeRoadviewButton {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 11;
      display: none;
      padding: 8px 14px;
      background-color: #041e42;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }

    /* 탭 버튼 */
    .tab-menu {
      display: flex;
    }

    .tab-button {
      flex: 1;
      padding: 12px 4px;
      border: none;
      border-bottom: 3px solid transparent;
      background-color: #f5f5f5;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      color: #666;
    }

    .tab-button.active {
      background-color: white;
      color: #041e42;
      border-bottom: 3px solid #d00f31;
    }

    /* 검색창 (탭 2에서만 보임) */
    .search-box {
      display: none;
      padding: 12px;
      gap: 6px;
      border-bottom: 1px solid #ddd;
    }

    .search-box.visible {
      display: flex;
    }

    .search-box input {
      flex: 1;
      padding: 8px;
      font-size: 14px;
    }

    .search-box button {
      padding: 8px 12px;
      cursor: pointer;
    }

    /* 검색 결과 리스트 */
    #resultList {
      flex: 1;
      overflow-y: auto;
      list-style: none;
    }

    #resultList li {
      padding: 12px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
    }

    #resultList li:hover {
      background-color: #f3f6ff;
    }

    .place-name {
      font-weight: bold;
      margin-bottom: 4px;
    }

    .place-player {
      font-size: 13px;
      color: #d00f31;
      font-weight: bold;
      margin-bottom: 2px;
    }

    .place-address {
      font-size: 13px;
      color: #666;
    }

    .place-distance {
      font-size: 12px;
      color: #999;
      margin-top: 2px;
    }

    .message {
      padding: 12px;
      color: #888;
      font-size: 14px;
      cursor: default;
    }

    /* 마커 팝업(인포윈도우) 안쪽 스타일 */
    .info-content {
      padding: 8px 10px;
      font-size: 13px;
      min-width: 190px;
    }

    .info-name {
      font-weight: bold;
      margin-bottom: 4px;
    }

    .info-player {
      color: #d00f31;
      font-weight: bold;
      margin-bottom: 4px;
    }

    .info-address {
      color: #555;
      margin-bottom: 6px;
    }

    .roadview-button {
      padding: 4px 8px;
      font-size: 12px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 왼쪽: 탭 + 검색창 + 결과 리스트 -->
    <div class="sidebar">
      <div class="tab-menu">
        <button class="tab-button active" id="tabFood">롯데 선수 추천 음식점</button>
        <button class="tab-button" id="tabPlayer">선수명으로 검색</button>
      </div>

      <div class="search-box" id="searchBox">
        <input type="text" id="keywordInput" placeholder="선수 이름을 입력하세요 (예: 최준용)">
        <button id="searchButton">검색</button>
      </div>

      <ul id="resultList">
        <li class="message">맛집 위치를 불러오고 있어요...</li>
      </ul>
    </div>

    <!-- 오른쪽: 지도 + 로드뷰 -->
    <div class="map-area">
      <div id="map"></div>
      <div id="roadview"></div>
      <button id="closeRoadviewButton">로드뷰 닫기</button>
    </div>
  </div>

  <!-- 카카오맵 SDK (autoload=false: 우리가 원하는 때 직접 로딩) -->
  <script src="//dapi.kakao.com/v2/maps/sdk.js?appkey=654464dfc5d446f2196b6b0a69e4ba29&libraries=services&autoload=false"></script>

  <script>
    // 엑셀(롯데_선수_추천_맛집.xlsx)에서 가져온 맛집 데이터
    // position은 주소를 좌표로 바꾼 뒤 자동으로 채워져요
    const restaurantList = [
      { name: "두루미", address: "부산 부산진구 동천로132번길 20", player: "김진욱" },
      { name: "후발대", address: "부산 부산진구 부전로20번길 32-5", player: "윤동희" },
      { name: "삼차회담", address: "부산 연제구 거제천로 41-1 1층", player: "고승민" },
      { name: "석정갈비", address: "부산 동래구 중앙대로 1367번길 72", player: "노진혁" },
      { name: "83해치", address: "부산 부산진구 서전로 11-1", player: "손성빈" },
      { name: "멜리초콜릿", address: "부산 동래구 석사로 18번길 20", player: "황성빈" },
      { name: "돈군", address: "부산 수영구 광안해변로 175 2층", player: "최준용" },
      { name: "고성범연탄구이", address: "부산 수영구 광안로 16번길 26 1층", player: "최준용" },
      { name: "자매국밥", address: "부산 수영구 민락본동로 27번길 56", player: "유강남" },
      { name: "가야포차선지국밥", address: "부산 부산진구 가야2동 506-13", player: "박승욱" },
      { name: "칸다소바", address: "부산 부산진구 부전동 144-1", player: "김민수" },
      { name: "온천천양곱창", address: "부산 동래구 온천동 189-34", player: "노진혁" },
      { name: "경주국밥", address: "부산 동래구 사직동 78-42", player: "김진욱" }
    ];

    // 지도, 검색 객체, 로드뷰 객체 등을 저장할 변수
    let map;
    let geocoder;
    let placesService;
    let roadview;
    let roadviewClient;
    let infowindow;
    let currentPosition = null; // 내 위치 (못 가져오면 null)
    let markerList = [];        // 지도에 표시된 마커 목록

    // 카카오맵 SDK가 완전히 로드된 뒤에 실행 (로딩 오류 방지)
    kakao.maps.load(function () {
      // 처음 지도 중심: 부산 사직야구장 근처 (내 위치를 못 가져올 때도 사용)
      const defaultPosition = new kakao.maps.LatLng(35.1941, 129.0615);

      // 지도 생성 (확대 레벨은 5)
      map = new kakao.maps.Map(document.getElementById("map"), {
        center: defaultPosition,
        level: 5
      });

      // 주소 변환, 장소 검색, 로드뷰, 팝업 객체 생성
      geocoder = new kakao.maps.services.Geocoder();
      placesService = new kakao.maps.services.Places();
      roadview = new kakao.maps.Roadview(document.getElementById("roadview"));
      roadviewClient = new kakao.maps.RoadviewClient();
      infowindow = new kakao.maps.InfoWindow({ zIndex: 1 });

      // 이벤트 연결
      document.getElementById("tabFood").addEventListener("click", function () {
        changeTab("food");
      });
      document.getElementById("tabPlayer").addEventListener("click", function () {
        changeTab("player");
      });
      document.getElementById("searchButton").addEventListener("click", searchByPlayerName);
      document.getElementById("keywordInput").addEventListener("keydown", function (event) {
        if (event.key === "Enter") {
          searchByPlayerName();
        }
      });
      document.getElementById("closeRoadviewButton").addEventListener("click", closeRoadview);

      // 내 위치 확인 → 맛집 주소를 좌표로 변환 → 첫 번째 탭 표시
      getCurrentPosition(function () {
        convertAllAddresses(function () {
          changeTab("food");
        });
      });
    });

    // 내 위치 가져오기 (성공이든 실패든 끝나면 callback 실행)
    function getCurrentPosition(callback) {
      if (!navigator.geolocation) {
        callback();
        return;
      }

      navigator.geolocation.getCurrentPosition(
        function (position) {
          currentPosition = new kakao.maps.LatLng(
            position.coords.latitude,
            position.coords.longitude
          );
          callback();
        },
        function (error) {
          // 권한을 거부했거나 오류가 나면 내 위치 없이 진행
          console.log("위치 정보를 가져오지 못했어요:", error.message);
          callback();
        }
      );
    }

    // 모든 맛집의 주소를 좌표로 바꾸기 (한 번만 하면 됨)
    function convertAllAddresses(callback) {
      let finishedCount = 0;

      restaurantList.forEach(function (restaurant) {
        // 주소로 먼저 찾아보고, 실패하면 "부산 + 가게 이름"으로 다시 검색
        geocoder.addressSearch(restaurant.address, function (result, status) {
          if (status === kakao.maps.services.Status.OK) {
            restaurant.position = new kakao.maps.LatLng(result[0].y, result[0].x);
            finishedCount++;
            checkFinished();
          } else {
            placesService.keywordSearch("부산 " + restaurant.name, function (data, status2) {
              if (status2 === kakao.maps.services.Status.OK) {
                restaurant.position = new kakao.maps.LatLng(data[0].y, data[0].x);
              } else {
                console.log("좌표를 찾지 못했어요:", restaurant.name);
              }
              finishedCount++;
              checkFinished();
            });
          }
        });
      });

      // 모든 변환이 끝났는지 확인
      function checkFinished() {
        if (finishedCount === restaurantList.length) {
          callback();
        }
      }
    }

    // 탭 바꾸기: 기존 마커와 리스트를 지우고 새 결과만 표시
    function changeTab(tabName) {
      // 탭 버튼 모양 바꾸기
      document.getElementById("tabFood").classList.toggle("active", tabName === "food");
      document.getElementById("tabPlayer").classList.toggle("active", tabName === "player");

      // 검색창은 탭 2에서만 보이기
      document.getElementById("searchBox").classList.toggle("visible", tabName === "player");

      // 기존 결과 지우기
      clearResults();

      if (tabName === "food") {
        // 탭 1: 전체 맛집 보여주기
        showRestaurants(restaurantList);
      } else {
        // 탭 2: 입력된 선수 이름이 있으면 바로 검색
        const keyword = document.getElementById("keywordInput").value.trim();
        if (keyword === "") {
          showMessage("선수 이름을 입력하고 검색해 주세요.");
        } else {
          searchByPlayerName();
        }
      }
    }

    // 탭 2: 선수 이름으로 맛집 찾기
    function searchByPlayerName() {
      const keyword = document.getElementById("keywordInput").value.trim();

      if (keyword === "") {
        alert("선수 이름을 입력해 주세요!");
        return;
      }

      // 추천 선수 이름에 검색어가 들어간 맛집만 고르기
      const filteredList = restaurantList.filter(function (restaurant) {
        return restaurant.player.includes(keyword);
      });

      clearResults();

      if (filteredList.length === 0) {
        showMessage("'" + keyword + "' 선수의 추천 맛집이 없어요.");
        return;
      }

      showRestaurants(filteredList);
    }

    // 맛집 목록을 지도(마커)와 왼쪽 리스트에 표시하기
    function showRestaurants(list) {
      const resultList = document.getElementById("resultList");
      const bounds = new kakao.maps.LatLngBounds();
      let shownCount = 0;

      // 내 위치가 있으면 가까운 순서로 정렬
      const sortedList = list.slice();
      if (currentPosition) {
        sortedList.sort(function (a, b) {
          return getDistance(a) - getDistance(b);
        });
      }

      sortedList.forEach(function (restaurant) {
        // 좌표를 못 찾은 가게는 건너뛰기
        if (!restaurant.position) {
          return;
        }

        // 마커 만들기
        const marker = new kakao.maps.Marker({
          map: map,
          position: restaurant.position
        });
        markerList.push(marker);
        bounds.extend(restaurant.position);
        shownCount++;

        // 리스트 항목 만들기 (textContent를 써서 안전하게 글자만 넣기)
        const listItem = document.createElement("li");

        const nameDiv = document.createElement("div");
        nameDiv.className = "place-name";
        nameDiv.textContent = restaurant.name;

        const playerDiv = document.createElement("div");
        playerDiv.className = "place-player";
        playerDiv.textContent = "추천: " + restaurant.player;

        const addressDiv = document.createElement("div");
        addressDiv.className = "place-address";
        addressDiv.textContent = restaurant.address;

        listItem.appendChild(nameDiv);
        listItem.appendChild(playerDiv);
        listItem.appendChild(addressDiv);

        // 내 위치가 있으면 거리도 보여주기
        if (currentPosition) {
          const distanceDiv = document.createElement("div");
          distanceDiv.className = "place-distance";
          distanceDiv.textContent = "내 위치에서 " + formatDistance(getDistance(restaurant));
          listItem.appendChild(distanceDiv);
        }

        resultList.appendChild(listItem);

        // 마커를 누르면 팝업 표시
        kakao.maps.event.addListener(marker, "click", function () {
          showInfoWindow(marker, restaurant);
        });

        // 리스트를 눌러도 같은 팝업 표시
        listItem.addEventListener("click", function () {
          map.setCenter(restaurant.position);
          showInfoWindow(marker, restaurant);
        });
      });

      if (shownCount === 0) {
        showMessage("표시할 수 있는 맛집이 없어요.");
        return;
      }

      // 표시된 맛집이 모두 보이도록 지도 범위 조정
      map.setBounds(bounds);
    }

    // 내 위치에서 맛집까지의 직선거리 (미터)
    function getDistance(restaurant) {
      const line = new kakao.maps.Polyline({
        path: [currentPosition, restaurant.position]
      });
      return line.getLength();
    }

    // 거리를 보기 좋게 바꾸기 (예: 850m, 12.3km)
    function formatDistance(meter) {
      if (meter < 1000) {
        return Math.round(meter) + "m";
      }
      return (meter / 1000).toFixed(1) + "km";
    }

    // 팝업(인포윈도우): 가게 이름, 추천 선수, 주소, 로드뷰 버튼
    function showInfoWindow(marker, restaurant) {
      const content = document.createElement("div");
      content.className = "info-content";

      const nameDiv = document.createElement("div");
      nameDiv.className = "info-name";
      nameDiv.textContent = restaurant.name;

      const playerDiv = document.createElement("div");
      playerDiv.className = "info-player";
      playerDiv.textContent = "추천: " + restaurant.player;

      const addressDiv = document.createElement("div");
      addressDiv.className = "info-address";
      addressDiv.textContent = restaurant.address;

      const roadviewButton = document.createElement("button");
      roadviewButton.className = "roadview-button";
      roadviewButton.textContent = "로드뷰 보기";
      roadviewButton.addEventListener("click", function () {
        openRoadview(marker.getPosition());
      });

      content.appendChild(nameDiv);
      content.appendChild(playerDiv);
      content.appendChild(addressDiv);
      content.appendChild(roadviewButton);

      infowindow.setContent(content);
      infowindow.open(map, marker);
    }

    // 로드뷰 열기: 선택한 위치에서 가장 가까운 로드뷰 찾기
    function openRoadview(position) {
      // 반경 50m 안에서 로드뷰가 있는지 찾기
      roadviewClient.getNearestPanoId(position, 50, function (panoId) {
        if (panoId === null) {
          alert("이 장소 근처에는 로드뷰가 없어요.");
          return;
        }

        document.getElementById("roadview").style.display = "block";
        document.getElementById("closeRoadviewButton").style.display = "block";

        roadview.setPanoId(panoId, position);
        roadview.relayout(); // 숨겨져 있다가 나타났으므로 크기를 다시 계산
      });
    }

    // 로드뷰 닫기
    function closeRoadview() {
      document.getElementById("roadview").style.display = "none";
      document.getElementById("closeRoadviewButton").style.display = "none";
    }

    // 기존 마커, 팝업, 리스트 모두 지우기
    function clearResults() {
      markerList.forEach(function (marker) {
        marker.setMap(null);
      });
      markerList = [];

      infowindow.close();
      closeRoadview();
      document.getElementById("resultList").innerHTML = "";
    }

    // 리스트 영역에 안내 문구 보여주기
    function showMessage(text) {
      const resultList = document.getElementById("resultList");
      resultList.innerHTML = "";

      const messageItem = document.createElement("li");
      messageItem.className = "message";
      messageItem.textContent = text;
      resultList.appendChild(messageItem);
    }
  </script>
</body>
</html>
